{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <span class="plant-icon">🌱</span>
            <h2>Forgot Password</h2>
            <p class="sub-text">We will send you an OTP to reset your password</p>
        </div>

        {% if success %}
        <div class="alert alert-success" id="alertBox">
            {{ success }}
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger" id="alertBox">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="auth-form" onsubmit="showLoading()">

            <div class="input-group-custom">
                <span class="input-icon">📧</span>
                <input type="email" name="email" placeholder="Enter your registered email" required>
            </div>

            <button type="submit" class="btn-auth" id="submitBtn">
                <span id="btnText">Send OTP</span>
                <span id="loader" style="display:none;">⏳ Sending...</span>
            </button>

        </form>

        <div class="auth-footer">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </div>

    </div>
</div>

<script>
    function showLoading() {
        document.getElementById("btnText").style.display = "none";
        document.getElementById("loader").style.display = "inline";
        document.getElementById("submitBtn").disabled = true;
    }

    // Auto hide alert after 3 sec
    setTimeout(() => {
        let alertBox = document.getElementById("alertBox");
        if (alertBox) {
            alertBox.style.opacity = "0";
            setTimeout(() => {
                alertBox.style.display = "none";
            }, 500);
        }
    }, 3000);
</script>

{% endblock %}
